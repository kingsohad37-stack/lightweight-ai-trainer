<section id="autoMode" class="card">
  <h2>Build an AI in 2 steps</h2>
  <p class="auto-help">1. Describe what you want. 2. Download the trained, deployable AI package.</p>
  <textarea id="autoPrompt" placeholder="Example: Build a customer-support chatbot for my product that answers common questions conversationally."></textarea>
  <button id="autoBuild" type="button">Build my AI</button>
  <div id="autoStatus" role="status" aria-live="polite"></div>
  <pre id="autoResult" class="auto-result"></pre>
  <a id="autoDownload" class="button" hidden download>Download deployable AI</a>
</section>
