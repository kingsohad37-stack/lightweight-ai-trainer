services:
  - type: web
    name: lightweight-ai-trainer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TRAINER_DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_BYTES
        value: "26214400"
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: MAX_EPOCHS
        value: "200"
      - key: MAX_BATCH_SIZE
        value: "512"
      - key: MAX_HIDDEN_UNITS
        value: "512"
      - key: TRAINER_API_KEY
        sync: false
      - key: TRAINER_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_BASE_URL
        sync: false
